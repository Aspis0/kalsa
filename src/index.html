<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalsa Brain</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">LOCAL AI SERVER</p>
        <h1 class="app-name">Kalsa Brain</h1>
      </div>
      <span class="app-mark" aria-hidden="true">KB</span>
    </header>
    <nav role="tablist" aria-label="Pages">
      <button type="button" role="tab" id="tab-status" data-page="status"
              aria-controls="page-status" aria-selected="true">Status</button>
      <button type="button" role="tab" id="tab-model" data-page="model"
              aria-controls="page-model" aria-selected="false" tabindex="-1">Model</button>
      <button type="button" role="tab" id="tab-pairing" data-page="pairing"
              aria-controls="page-pairing" aria-selected="false" tabindex="-1">Pairing</button>
    </nav>
    <main>
      <section id="page-status" role="tabpanel" aria-labelledby="tab-status"></section>

      <section id="page-model" role="tabpanel" aria-labelledby="tab-model" hidden></section>

      <section id="page-pairing" role="tabpanel" aria-labelledby="tab-pairing" hidden></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
