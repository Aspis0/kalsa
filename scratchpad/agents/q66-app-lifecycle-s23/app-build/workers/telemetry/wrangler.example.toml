# Template only. Copy to wrangler.toml after creating namespaces.
# Never commit real IDs into this file.
#
# Create namespaces (once per environment):
#   npx wrangler kv namespace create TELEMETRY_DEDUPE
#   npx wrangler kv namespace create TELEMETRY_DEDUPE --preview
# Paste the printed 32-hex ids below. Staging and production MUST differ.

name = "kalsa-telemetry"
main = "index.ts"
compatibility_date = "2024-11-01"
workers_dev = false

[[durable_objects.bindings]]
name = "TELEMETRY_BUFFER"
class_name = "TelemetryBuffer"

[[migrations]]
tag = "v1"
new_classes = ["TelemetryBuffer"]

[[kv_namespaces]]
binding = "DEDUPE_KV"
# id = "<paste TELEMETRY_DEDUPE id>"
# preview_id = "<paste TELEMETRY_DEDUPE --preview id>"

[vars]
GITHUB_REPO = "Aspis0/kalsa"
AUTO_OPEN_ISSUES = "false"
