[package]
name = "kalsa-iroh-mobile"
version = "0.1.0"
edition = "2021"
description = "uniffi face of brain's kalsa-iroh road: dial the Kalsa desktop from the Android app"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# The network-free rig the integration tests dial through; never default,
# never in a phone build.
test-support = []

[dependencies]
# The road itself, pinned to the brain rev whose ALPN contract is frozen.
kalsa-iroh = { git = "https://github.com/Aspis0/kalsa.git", rev = "a2cb3c93d6f711c5f42deafaa9d354a7a63166a1" }
# The wrapper parks FFI calls on this runtime; brain's accept loop needs it too.
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
# Pinned exactly: the bindings and the scaffolding must come from one version.
uniffi = { version = "=0.32.2", features = ["cli"] }

[dev-dependencies]
# The desktop side of the tests is brain's bridge directly.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[test]]
name = "key_file"
required-features = ["test-support"]

[[test]]
name = "roundtrip"
required-features = ["test-support"]

[[test]]
name = "tunnel_lifecycle"
required-features = ["test-support"]

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "thin"
