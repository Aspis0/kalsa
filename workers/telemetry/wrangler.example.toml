# Template only. Copy to wrangler.toml and adjust vars.
# Never commit real IDs into this file.

name = "kalsa-telemetry"
main = "index.ts"
compatibility_date = "2024-11-01"
workers_dev = false

# Production origin (Kalsa-owned custom domain; the only origin).
routes = [ { pattern = "telemetry.kalsa.io", custom_domain = true } ]

[[durable_objects.bindings]]
name = "TELEMETRY_BUFFER"
class_name = "TelemetryBuffer"

[[migrations]]
tag = "v1"
new_classes = ["TelemetryBuffer"]

[vars]
GITHUB_REPO = "Aspis0/kalsa"
AUTO_OPEN_ISSUES = "false"
