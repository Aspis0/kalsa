name = "kalsa-telemetry"
main = "index.ts"
compatibility_date = "2024-11-01"
# The Kalsa-owned custom domain below is the ONLY origin. workers.dev is
# intentionally disabled: the project has no released build, so no install ever
# used the previous *.workers.dev host and there is nothing left to keep alive.
workers_dev = false

# Production route is declared here (not in the CF dashboard), so every future
# deploy keeps it. Disabling workers_dev above removes the legacy host entirely.
routes = [ { pattern = "telemetry.kalsa.io", custom_domain = true } ]
# Client constant: TELEMETRY_WORKER_URL in src/telemetry/config.ts
# Dev override: AsyncStorage key kalsa.telemetry.url
#
[[durable_objects.bindings]]
name = "TELEMETRY_BUFFER"
class_name = "TelemetryBuffer"

[[migrations]]
tag = "v1"
# Free plan requires SQLite-backed DOs. First deploy — v1 has never been applied.
new_sqlite_classes = ["TelemetryBuffer"]

# Secrets (wrangler secret put …) — never commit values:
#   GITHUB_TOKEN   — fine-grained, issues:write on the target repo
#   FLUSH_TOKEN    — random long token for GET /flush
#   ADMIN_TOKEN    — separate random token for POST /admin/flush-and-purge
#   READ_TOKEN     — separate random token for GET /admin/reports
# Vars:
#   GITHUB_REPO=Aspis0/kalsa          (staging: use a test repo)
#   AUTO_OPEN_ISSUES=false

[vars]
GITHUB_REPO = "Aspis0/kalsa"
AUTO_OPEN_ISSUES = "false"
