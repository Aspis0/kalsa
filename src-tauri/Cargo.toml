[package]
name = "kalsa-brain"
description = "Desktop app for the Kalsa Brain server"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Digest checks over the chosen model's downloaded bytes.
sha2 = "0.10"
kalsa-catalog = { path = "../crates/kalsa-catalog" }
kalsa-door = { path = "../crates/kalsa-door" }
kalsa-launch = { path = "../crates/kalsa-launch" }
kalsa-download = { path = "../crates/kalsa-download" }
# The cheap first pass over stores that name blobs by digest, ahead of
# kalsa-download's generic scan (startup.rs, acquire_model).
kalsa-reuse = { path = "../crates/kalsa-reuse" }
kalsa-iroh = { path = "../crates/kalsa-iroh" }
kalsa-pairing = { path = "../crates/kalsa-pairing" }
kalsa-probe = { path = "../crates/kalsa-probe" }
kalsa-runtime = { path = "../crates/kalsa-runtime" }
kalsa-sentinel = { path = "../crates/kalsa-sentinel" }
kalsa-supervisor = { path = "../crates/kalsa-supervisor" }
# The assistant's web search and page fetch. Requests leave from Rust: the
# page's content security policy admits its own machine and nothing else.
kalsa-web = { path = "../crates/kalsa-web" }
serde = { version = "1", features = ["derive"] }
# The two pairing messages on the wire, and the DTO the page reads.
serde_json = "1"
tauri = { version = "2", features = [] }
# The iroh road runs on tokio; the app owns the executor (see road.rs).
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# The machine's RAM, for the catalog's memory budget.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }
