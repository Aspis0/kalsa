plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kalsa.iroh'
version = '0.1.0'

android {
  namespace "expo.modules.kalsairoh"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The uniffi Kotlin runtime speaks JNA; the @aar is the Android build.
  // 5.16.0 carried the first Android 16 KB fix (#1618) but its AAR still
  // crashes on 16 KB devices (#1647), fixed in 5.17.0 — see JNA CHANGES.md.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
}
