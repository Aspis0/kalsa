plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kalsa.iroh'
version = '0.1.0'

android {
  namespace "expo.modules.kalsairoh"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The uniffi Kotlin runtime speaks JNA; the @aar is the Android build.
  // 5.16.0 is the first release with the Android 16 KB page-size fix
  // (JNA CHANGES.md, issue #1618); a follow-up (#1647) landed in 5.17.0.
  implementation "net.java.dev.jna:jna:5.16.0@aar"
}
