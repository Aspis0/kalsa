name: Screens (visual capture)

# Captures many app states on a KVM-accelerated emulator for visual review.
# Seeds AsyncStorage — no GGUF download, no inference. Manual only.
on:
  workflow_dispatch:
    inputs:
      enable_animations:
        description: "Run with system animations ON (keyboard-controller needs WindowInsetsAnimation onStart; disable-animations suppresses it on the emulator)"
        type: boolean
        default: false

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm ci

      - name: Typecheck + logic harnesses
        run: |
          npm run typecheck
          node scripts/retrieverHarness.mjs
          node scripts/compactorHarness.mjs
          node scripts/retrievalLoopHarness.mjs
          node scripts/htmlToTextHarness.mjs
          node scripts/pdfTextHarness.mjs
          node scripts/pdfBridgeHarness.mjs
          node scripts/pdfTextServiceHarness.mjs
          node scripts/webFetchHarness.mjs
          node scripts/toolSourceLedgerHarness.mjs
          node scripts/base64Harness.mjs
          node scripts/pdfCacheFsHarness.mjs
          node scripts/longChatEstimateHarness.mjs
          node scripts/thinkStripperHarness.mjs
          node scripts/streamCoalescerHarness.mjs
          node scripts/turnTelemetryHarness.mjs
          node scripts/thinkingBudgetsHarness.mjs
          node scripts/benchSpeculativeHarness.mjs
          node scripts/benchEngineHarness.mjs

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Prebuild (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (x86_64 only — emulator ABI, keeps CI fast)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
          ls -la app/build/outputs/apk/release/

      # No GGUF download: ci-screens.sh never runs inference. install_and_sideload
      # receives a tiny dummy model.gguf created by the script when missing.

      - name: Capture screens on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35, not 34: the app targets the Android 15/16 edge-to-edge era
          # (mandatory since SDK 35) — the field device class. On API<=34 RN's
          # edge-to-edge flag never enables and keyboard-controller keeps a
          # ~navbar-height shortfall (empirically unchanged by the provider's
          # translucent props, runs 31219016159/31221427122) — a known legacy
          # residual, not our target world. 13b asserts the world we ship for.
          api-level: 35
          target: google_apis
          arch: x86_64
          # Without a profile the AVD comes up at 320x640 and every tap lands
          # off-screen; a real phone profile also matches the app's layout.
          profile: pixel_6
          cores: 4
          ram-size: 8192M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: ${{ !inputs.enable_animations }}
          script: bash scripts/ci-screens.sh

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            e2e-out/**
          if-no-files-found: warn
