name: APK (device build)

# Builds an installable APK for a real phone. The other three workflows build
# -PreactNativeArchitectures=x86_64 because they only ever run on an emulator —
# those APKs do not run on an arm64 device. This one exists to produce something
# you can sideload.
#
# Release is signed with the debug keystore the prebuild template generates, not
# with anything in this repo: android/ is untracked on purpose (.gitignore:42,
# "native generated folders stay out until prebuild is intentional"), so there is
# no committed keystore or build.gradle to point a reader at. Every build of this
# pipeline therefore carries the same key, which is why `adb install -r` replaces
# a previous build in place. Sideloadable, not publishable.
#
# NEVER uninstall to work around a signature error on a measurement phone:
# uninstall deletes the app data, and that includes the KV store -- the .kvs files
# a session-reuse measurement is about, and RKStorage with it. If `install -r`
# ever fails, stop and say so. Which build gets sacrificed is a decision, not a
# reflex.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [arm64-v8a, "arm64-v8a,armeabi-v7a", x86_64]

      debuggable:
        description: "true produces a bench instrument for a physical device (run-as works, the harness can reach the app DB); it is NOT for distribution."
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm ci

      # A git dependency has no lockfile integrity anyone verifies, and what
      # npm installs is the fork's `npm pack` output, not its commit tree. This
      # refetches the pinned commit, packs it, and compares file by file.
      - name: Assert the installed engine is the pinned fork commit
        run: bash scripts/assert-engine-provenance.sh

      # The fork vendors whole directories into vendor/llama.cpp (its own
      # scripts/sync-vendor.sh), but a directory the vendor manifest never names
      # is still absent, so a file a source starts including can be simply
      # missing and the NDK fails ~5 min into the build. This catches it right
      # after install, in seconds.
      - name: Assert the assembled engine's includes all resolve
        # The runner has an NDK, so the syntax pass must use it: the host clang
        # accepts constructs the NDK rejects, and a silent fallback would be a
        # green gate for a weaker check.
        env:
          KALSA_GATE_REQUIRE_NDK: "1"
        run: bash scripts/assert-overlay-includes.sh

      # Same logic-gate as bench.yml: every *Harness.mjs run in bench.yml's
      # typecheck step is run here too. Parity is not a promise — it is enforced
      # structurally by scripts/matrixParityHarness.mjs (which fails naming any
      # harness present in bench.yml but missing here). This workflow has no
      # emulator, so no inference — contracts only.
      - name: Typecheck + logic harnesses
        run: |
          npm run typecheck
          node scripts/retrieverHarness.mjs
          node scripts/compactorHarness.mjs
          node scripts/retrievalLoopHarness.mjs
          node scripts/htmlToTextHarness.mjs
          node scripts/pdfTextHarness.mjs
          node scripts/pdfBridgeHarness.mjs
          node scripts/pdfTextServiceHarness.mjs
          node scripts/webFetchHarness.mjs
          node scripts/toolSourceLedgerHarness.mjs
          node scripts/base64Harness.mjs
          node scripts/pdfCacheFsHarness.mjs
          node scripts/longChatEstimateHarness.mjs
          node scripts/thinkStripperHarness.mjs
          node scripts/streamCoalescerHarness.mjs
          node scripts/turnTelemetryHarness.mjs
          node scripts/thinkingBudgetsHarness.mjs
          node scripts/benchSpeculativeHarness.mjs
          node scripts/bufferShimHarness.mjs
          node scripts/benchEngineHarness.mjs
          node scripts/engineParamsHarness.mjs
          node scripts/threadProfileHarness.mjs
          node scripts/memoryEstimateHarness.mjs
          node scripts/sessionMetaHarness.mjs
          node scripts/sessionSaveGateHarness.mjs
          node scripts/prefixPrewarmHarness.mjs
          node scripts/memoryFactsTailHarness.mjs
          node scripts/voiceStateHarness.mjs
          node scripts/webFetchPdfMutationMatrix.mjs
          node scripts/benchGradeHarness.mjs
          node scripts/benchAggregateHarness.mjs
          node scripts/benchNCtxHarness.mjs
          # Gates for the privacy guard, the LFM tool dialect and memory telemetry.
          # Absent until 2026-08-14: all three shipped with manual-only verification.
          node scripts/rulesCoreHarness.mjs
          node scripts/toolCallParseHarness.mjs
          node scripts/memoryTelemetryHarness.mjs
          node scripts/toolRoundExhaustedHarness.mjs
          node scripts/toolBenchHarness.mjs
          node scripts/telemetryClampHarness.mjs
          # Same energy harnesses as bench.yml (parity is enforced by
          # matrixParityHarness.mjs): both offline on synthetic fixtures.
          node scripts/energySchemaHarness.mjs
          node scripts/energyPhaseSplitHarness.mjs
          # npx jest and scripts/test_sideload_guards.sh are intentionally NOT
          # run here: they gate the emulator/sideload path, not the sideloadable
          # artifact this workflow produces, so they have nothing to assert on a
          # device-only APK build.
          node scripts/matrixParityHarness.mjs
          # Orphan harnesses: until 2026-09-17 these ran in no workflow — which
          # is how embeddingServiceHarness and telemetryHarness rotted silently
          # (both repaired in c1951a8).
          node scripts/anti_oom_harness.mjs
          node scripts/compactionParseHarness.mjs
          node scripts/conversationsStoreHarness.mjs
          node scripts/dailyUseHarness.mjs
          node scripts/deviceProfileHarness.mjs
          node scripts/documentLibraryHarness.mjs
          node scripts/docxToTextHarness.mjs
          node scripts/eagerKickHarness.mjs
          node scripts/embeddingServiceHarness.mjs
          node scripts/i18nParityHarness.mjs
          node scripts/llamaContextGateHarness.mjs
          node scripts/markdownHarness.mjs
          node scripts/regen_harness.mjs
          node scripts/researchPlanHarness.mjs
          node scripts/semanticIndexHarness.mjs
          node scripts/telemetryHarness.mjs
          node scripts/telemetryWorkerHarness.mjs
          node scripts/thinkHistoryHarness.mjs
          node scripts/tuningLayerHarness.mjs

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      # The llama.rn fork carries the engine sources in its cpp/ and the
      # plugin (plugins/withLlamaFromSource.js) always compiles them from
      # source; there is no patch step. KALSA_LLAMA_FROM_SOURCE=0 is not
      # supported: the fork ships no prebuilt jniLibs, so setting it
      # hard-fails the build.
      # The env is set here only for explicitness — it changes nothing in CI.
      # The real guarantee the fork's engine is in the binary is the
      # assert-native-patch.sh step below, not this env.
      - name: Prebuild (CNG)
        env:
          KALSA_LLAMA_FROM_SOURCE: "1"
        run: npx expo prebuild --platform android --no-install

      # On a non-rooted user build, assembleRelease (debuggable=false) refuses
      # run-as, so the bench harness cannot reach the app DB or sideload a model.
      # The GENERATED android/app/build.gradle is gitignored (see .gitignore),
      # so this edit cannot be a committed source file — it must run after
      # prebuild and before assembleRelease. Idempotent; fails loudly (exit 1)
      # if the release block anchor is missing, because a silent no-op here
      # yields an APK that looks fine and cannot be benchmarked.
      - name: Make release build debuggable (physical-device bench instrument)
        if: inputs.debuggable == 'true'
        run: |
          GRADLE=android/app/build.gradle
          if [ ! -f "$GRADLE" ]; then
            echo "FATAL: $GRADLE not found — did expo prebuild run?"; exit 1
          fi
          # Insert 'debuggable true' right after the buildTypes release { line.
          # Range is limited to the buildTypes block so signingConfigs.release
          # is never touched. The idempotence check (grep below) and the final
          # verification grep are scoped to this SAME buildTypes block, not the
          # whole file: a future template that sets 'debuggable true' in the
          # debug build type must not make the sed a no-op while a file-wide
          # guard still passes and ships a NON-debuggable APK reported
          # debuggable.
          BT=$(sed -n '/buildTypes {/,/^    }[[:space:]]*$/p' "$GRADLE")
          if printf '%s\n' "$BT" | grep -q 'debuggable true'; then
            echo "debuggable true already present in release block; idempotent no-op"
          else
            TMP=$(mktemp)
            sed '/buildTypes {/,/^    }[[:space:]]*$/ s/\(release {\)/\1\n            debuggable true/' "$GRADLE" > "$TMP" \
              && mv "$TMP" "$GRADLE"
          fi
          # Fail loudly if the anchor/edit did not land (within the buildTypes
          # block, not the whole file).
          BT=$(sed -n '/buildTypes {/,/^    }[[:space:]]*$/p' "$GRADLE")
          if ! printf '%s\n' "$BT" | grep -q 'debuggable true'; then
            echo "FATAL: 'release {' anchor not found in $GRADLE — debuggable not set"
            exit 1
          fi
          echo "added 'debuggable true' to the release build type (idempotent re-run prints the no-op line above)"
          echo "---- buildTypes block (after edit) ----"
          sed -n '/buildTypes {/,/^    }[[:space:]]*$/p' "$GRADLE"
          # The binding compiles content-bearing native logs (prompt text,
          # token ids, stop words) in only when this Gradle property is set;
          # the bench instrument needs them, the plain release must not carry
          # them — hence this edit lives only in the debuggable step.
          PROPS=android/gradle.properties
          if [ ! -f "$PROPS" ]; then
            echo "FATAL: $PROPS not found — did expo prebuild run?"; exit 1
          fi
          if ! grep -qx 'rnllamaLogContent=true' "$PROPS"; then
            # printf leads with \n: the generated properties file may lack a
            # trailing newline, and echo would glue the property onto its
            # last line (CI run 35958095874). The blank line is harmless.
            printf '\n%s\n' 'rnllamaLogContent=true' >> "$PROPS"
          fi
          # Fail loudly if the line is still absent (whole-line match, no
          # pipe: `| grep -q` under pipefail can die on SIGPIPE).
          if ! grep -qx 'rnllamaLogContent=true' "$PROPS"; then
            echo "FATAL: rnllamaLogContent=true not in $PROPS"
            exit 1
          fi
          echo "---- rnllamaLogContent line (after edit) ----"
          grep -xn 'rnllamaLogContent=true' "$PROPS"

      - name: Build APK (${{ inputs.abi }})
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures="${{ inputs.abi }}" --console=plain
          ls -la app/build/outputs/apk/release/

      # A benchmark that measures an unpatched binary measures the wrong binary.
      # assert-native-patch.sh exits 1 on a missing marker — fail the job, not warn.
      - name: Assert the native patch is in the binary
        run: bash scripts/assert-native-patch.sh

      - name: Report APK size and ABIs
        run: |
          cd android/app/build/outputs/apk/release
          ls -la app-release.apk
          unzip -l app-release.apk | grep -E "lib/[a-z0-9-]+/" | awk -F/ '{print $2}' | sort -u

      # Do NOT trust the gradle edit — verify the artifact. aapt2 ships with the
      # runner's Android SDK ($ANDROID_HOME/build-tools/*/aapt2). `aapt2 dump
      # badging` prints application flags as BARE TOKENS: the line is just
      # "application-debuggable" with no value, and it is ABSENT entirely when
      # the flag is not set (no value is ever printed). Both branches below
      # therefore grep the bare token — the true branch matches presence, the
      # false branch matches absence. (A bare-token grep is independent of
      # whether a value is ever printed.)
      - name: Verify debuggable flag in the built APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          if [ -z "$AAPT2" ]; then
            AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          fi
          if [ -z "$AAPT2" ]; then
            echo "FATAL: aapt2 not found under \$ANDROID_HOME/\$ANDROID_SDK_ROOT build-tools"; exit 1
          fi
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -E 'application-debuggable' || echo "[verify] (application-debuggable line absent)"
          echo "[verify] debuggable requested: ${{ inputs.debuggable }}"
          if [ "${{ inputs.debuggable }}" = "true" ]; then
            if echo "$BADGING" | grep -Eq 'application-debuggable'; then
              echo "[verify] OK: debuggable present in APK as requested (true)"
            else
              echo "[verify] FATAL: requested debuggable=true but flag absent from APK"; exit 1
            fi
          else
            if echo "$BADGING" | grep -Eq 'application-debuggable'; then
              echo "[verify] FATAL: requested debuggable=false but flag present in APK"; exit 1
            else
              echo "[verify] OK: debuggable absent from APK as requested (false)"
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalsa-apk-${{ inputs.abi }}${{ inputs.debuggable == 'true' && '-debuggable' || '' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
