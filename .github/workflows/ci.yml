name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Cargo check
        run: cargo check --workspace

      - name: Targeted Rust tests
        run: |
          cargo test -p kalsa-probe -p kalsa-catalog
          cargo test -p kalsa-engines
          cargo test -p kalsa-site

      - name: Frontend build
        working-directory: chat
        run: |
          npm ci
          npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # The Worker's assets binding points at ../site/dist, which is generated and git-ignored.
      - name: Generate the site the Worker serves
        run: cargo run -p kalsa-site

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Test
        working-directory: worker
        run: npm test
