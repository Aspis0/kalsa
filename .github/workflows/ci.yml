name: CI (typecheck + jest)

# Lightweight gate: TypeScript typecheck + the jest suite, run in-band. No
# emulator — about 80 seconds, not the ~35-min E2E run. Fires on main and
# feat/** pushes and feat/** pull requests; docs-only changes are ignored.
on:
  push:
    branches: [main, feat/**]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - docs/**
  pull_request:
    branches: [feat/**]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - docs/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Jest (in-band)
        run: npx jest --runInBand
