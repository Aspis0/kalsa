name: Bench (PIANO V4.2)

# Fase 0 (block-format × thinking A/B) and Fase 4 (compaction-survival,
# baseline vs V4.2) benchmark campaigns. One inference turn costs ~8.6 min
# on a 2-vCPU runner (see .github/workflows/e2e-emulator.yml, run 30836136405:
# reply after 516s) — so the APK is built EXACTLY ONCE by `build` and shared
# via artifact with every arm in `bench`, which runs the 6 arms of the chosen
# phase as parallel matrix jobs (fail-fast: false, so one flaky arm never
# takes the others down with it).
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Benchmark phase"
        required: true
        default: "fase0"
        type: choice
        options: [fase0, fase4, smoke, tools]
      model:
        description: "Model to test"
        required: true
        default: "qwen3.5-2b"
        type: choice
        options: [qwen3.5-2b, qwen3.5-4b, lfm2.5-2.6b, lfm2.5-8b-a1b]
      runs_per_arm:
        description: "Fase 0 ONLY — in-job repeat count per arm (PIANO: '3 run/formato'). Fase 4 always uses the fixed 6-seed matrix below, independent of this input."
        required: true
        default: "2"
        type: string
      nctx:
        description: "Bench-only n_ctx override (empty = catalog wins). Floor 2048."
        required: false
        default: ""
        type: string
      winbudget:
        description: "Bench-only verbatim-window char budget (empty = 16000). Controls how often compaction fires. Floor 500."
        required: false
        default: ""
        type: string
      legacywindow:
        description: "Bench-only legacy-window override (empty = LEGACY_MAX_HISTORY). Controls what falls out of context on both arms. Floor 4."
        required: false
        default: ""
        type: string
      ranking:
        description: "Bench-only ranking mode (empty = bm25). Controls digest retrieval: bm25 (lexical) or hybrid (BM25 + char 3-gram fused via RRF)."
        required: false
        default: ""
        type: string
        options:
          - ""
          - bm25
          - hybrid
      memory:
        description: "Enable memory subsystem (0 = off, 1 = on). When on, facts are extracted and stored. Default 0 (off) to avoid confounding compaction A/B."
        required: false
        default: "0"
        type: string
        options:
          - "0"
          - "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        # DO NOT set RNLLAMA_SKIP_POSTINSTALL here. It was tried (to remove a
        # GitHub-releases download that 503'd twice in run 31639595328) on the
        # reasoning that a from-source build never uses the prebuilt jniLibs.
        # Run 31650534307 disproved it: assert-native-patch.sh reported
        # "kalsa-native-patches MISSING ... llama.rn used its prebuilt jniLibs",
        # i.e. the APK was built WITHOUT the patches — the exact silent failure
        # that assert exists to catch. If the download flakes again, cache the
        # artifacts or retry; do not skip them.
        run: npm ci

      - name: Typecheck + logic harnesses
        run: |
          npm run typecheck
          node scripts/retrieverHarness.mjs
          node scripts/compactorHarness.mjs
          node scripts/retrievalLoopHarness.mjs
          node scripts/htmlToTextHarness.mjs
          node scripts/pdfTextHarness.mjs
          node scripts/pdfBridgeHarness.mjs
          node scripts/pdfTextServiceHarness.mjs
          node scripts/webFetchHarness.mjs
          node scripts/toolSourceLedgerHarness.mjs
          node scripts/base64Harness.mjs
          node scripts/pdfCacheFsHarness.mjs
          node scripts/longChatEstimateHarness.mjs
          node scripts/thinkStripperHarness.mjs
          node scripts/streamCoalescerHarness.mjs
          node scripts/turnTelemetryHarness.mjs
          node scripts/thinkingBudgetsHarness.mjs
          node scripts/benchSpeculativeHarness.mjs
          node scripts/bufferShimHarness.mjs
          node scripts/benchEngineHarness.mjs
          node scripts/engineParamsHarness.mjs
          node scripts/threadProfileHarness.mjs
          node scripts/memoryEstimateHarness.mjs
          node scripts/sessionMetaHarness.mjs
          node scripts/sessionSaveGateHarness.mjs
          node scripts/voiceStateHarness.mjs
          node scripts/webFetchPdfMutationMatrix.mjs
          node scripts/benchGradeHarness.mjs
          node scripts/benchAggregateHarness.mjs
          node scripts/benchNCtxHarness.mjs
          # Gates for the privacy guard, the LFM tool dialect and memory telemetry.
          # Absent until 2026-08-14: all three shipped with manual-only verification.
          node scripts/rulesCoreHarness.mjs
          node scripts/toolCallParseHarness.mjs
          node scripts/memoryTelemetryHarness.mjs
          node scripts/toolRoundExhaustedHarness.mjs
          node scripts/toolBenchHarness.mjs
          node scripts/telemetryClampHarness.mjs
          npx jest --silent
          # Sideload guards are bash, so the *Harness.mjs sweep does not see them.
          bash scripts/test_sideload_guards.sh
          node scripts/matrixParityHarness.mjs

      # Preflight: HEAD every model URL the workflow can select, fail fast if
      # any is unreachable or wrong-size. Runs BEFORE the expensive build steps
      # (Free disk space / Prebuild / Build APK) so a bad model ref fails in
      # seconds, not after burning 30+ minutes building an APK nobody will use.
      # Checks ALL four models (not just the selected one) — a broken ref for
      # an unselected model is a trap for the next person.
      - name: Preflight model URLs
        run: node scripts/benchPreflight.mjs

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Prebuild (CNG)
        # llama.rn ships PREBUILT jniLibs: without this env the patched cpp/ is
        # never compiled and patches/llama.rn+*.patch is a silent no-op.
        env:
          KALSA_LLAMA_FROM_SOURCE: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (x86_64 only — emulator ABI, keeps CI fast)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
          ls -la app/build/outputs/apk/release/

      # A benchmark that measures an unpatched binary measures the wrong binary.
      # assert-native-patch.sh exits 1 on a missing marker — fail the job, not warn.
      - name: Assert the native patch is in the binary
        run: bash scripts/assert-native-patch.sh

      - name: Upload APK (built ONCE, shared by every bench arm below)
        uses: actions/upload-artifact@v4
        with:
          name: kalsa-bench-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error

  bench:
    needs: build
    runs-on: ubuntu-latest
    # Generous safety ceiling: worst case is RUNS_PER_ARM(3)*3 turns (fase0) or
    # 9 turns (fase4), each gated at 1500s by ci-bench.sh's send_and_wait — well
    # under this, and WAY under GitHub's 6h hard job limit. Real turns finish in
    # ~8.6 min (516s), so typical wall-clock is closer to 90-100 min per arm.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Fase 0 — 3 block formats × 2 thinking modes (6 arms, 1 job each) ──
          - phase: fase0
            arm: none_off
            block_format: none
            thinking: "off"
          - phase: fase0
            arm: none_budget256
            block_format: none
            thinking: budget256
          - phase: fase0
            arm: user-prefix_off
            block_format: user-prefix
            thinking: "off"
          - phase: fase0
            arm: user-prefix_budget256
            block_format: user-prefix
            thinking: budget256
          - phase: fase0
            arm: user-note_off
            block_format: user-note
            thinking: "off"
          - phase: fase0
            arm: user-note_budget256
            block_format: user-note
            thinking: budget256
          # ── Fase 4 — 4 arms (baseline / v42 / ciswire / nogate) × 6 seeds
          # (24 jobs) ──
          # nogate sits on compaction: off (same base as baseline), toolchoice
          # unset (driver default auto), toolgate "0" — the gate A/B is one
          # variable, unconfounded by forcing. Forcing left the campaign after
          # smoke 31640101893 (recall already 1 on every arm; required cut
          # precision 0.167 vs baseline 0.500). The gate still helps
          # (required+gate vs required-nogate: spurious 5→3) and stays as
          # baseline vs nogate. On the v42 ("on") base the only clean
          # comparison is against v42, the losing compaction mode (fase4 run
          # 31595209203: v42 recall 0.802 vs baseline 0.792 with a collapsed
          # early probe), and any tool × compaction interaction is baked in
          # and unreadable.
          # WHY 6 not 3: with 3 vs 3 conversations the exhaustive one-sided
          # permutation floor is 2/C(6,3)+1 = 2/21 ≈ 0.095, so p < 0.05 is
          # unreachable by construction. 6 vs 6 → C(12,6)=924, exhaustive
          # floor 2/925 ≈ 0.0022. With PERM_ITERATIONS=10000 the Monte-Carlo
          # floor is 1/10001 ≈ 0.0001; the exhaustive floor dominates (is the
          # weaker bound) for this design. Seeds 1..6 map onto filler
          # rotations 0..7 ((SEED-1)%8), so the rotation is balanced and
          # paired across arms.
          # Quoted "off"/"on"/"ciswire": GitHub already passed bare off/on as
          # strings (verified run 30863711482), but quoting removes the doubt.
          # Three modes: off (legacy window), v42 (boundary+BM25), ciswire
          # (legacy window + BM25 additive). Primary comparison: ciswire vs off.
          # thinking stays "off" (budget256 made honesty/language unmeasurable
          # in run 31367691176 — Qwen3.5 bugs #20182/#20476).
          # block_format stays none; it still auto-upgrades to user-prefix once
          # compaction produces real digest/summary content
          # (see applyOperativeBlockFormat).
          - phase: fase4
            arm: baseline
            seed: 1
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: baseline
            seed: 2
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: baseline
            seed: 3
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: baseline
            seed: 4
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: baseline
            seed: 5
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: baseline
            seed: 6
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 1
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 2
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 3
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 4
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 5
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: v42
            seed: 6
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 1
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 2
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 3
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 4
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 5
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: fase4
            arm: ciswire
            seed: 6
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          # Gate A/B: same off/auto base as baseline, toolgate the only knob.
          - phase: fase4
            arm: nogate
            seed: 1
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          - phase: fase4
            arm: nogate
            seed: 2
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          - phase: fase4
            arm: nogate
            seed: 3
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          - phase: fase4
            arm: nogate
            seed: 4
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          - phase: fase4
            arm: nogate
            seed: 5
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          - phase: fase4
            arm: nogate
            seed: 6
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          # ── Smoke — ~5-turn harness self-test on all four arms (~20 min),
          # not a measurement campaign. Use phase=smoke dispatch instead of
          # burning the full 2-hour fase0/fase4 matrix when only the harness
          # needs a live emulator check.
          # WHY thinking "off" (not budget256): smoke must mirror the fase4
          # configuration it de-risks. A smoke that exercises a different
          # config de-risks nothing — evidence run 31434524869 (qwen3.5-4b,
          # budget256): turns 633s/233s/191s/484s then stall past 2400s at
          # turn 5, reasoning leaking into reply text.
          - phase: smoke
            arm: baseline
            seed: 1
            compaction: "off"
            block_format: none
            thinking: "off"
          - phase: smoke
            arm: v42
            seed: 1
            compaction: "on"
            block_format: none
            thinking: "off"
          - phase: smoke
            arm: ciswire
            seed: 1
            compaction: "ciswire"
            block_format: none
            thinking: "off"
          - phase: smoke
            arm: nogate
            seed: 1
            compaction: "off"
            block_format: none
            thinking: "off"
            toolgate: "0"
          # ── Tools — tool-use benchmark (required/forbidden/selection).
          # Measures whether the model calls tools at the right time and picks
          # the right tool. Not a compaction A/B; single arm, single seed.
          # Phase selected by input; no default matrix entry.
          - phase: tools
            arm: baseline
            seed: 1
            compaction: "off"
            block_format: none
            thinking: "off"
    # `matrix` is not available in a job-level `if`, so the phase filter lives
    # inside the matrix itself: entries carry their phase and the emulator step
    # is skipped for the non-selected ones (see the step-level `if`).
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        if: matrix.phase == inputs.phase
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download shared APK
        if: matrix.phase == inputs.phase
        uses: actions/download-artifact@v4
        with:
          name: kalsa-bench-apk
          path: android/app/build/outputs/apk/release/

      - name: Download GGUF model
        if: matrix.phase == inputs.phase
        # URLs come from benchPreflight.mjs (reads ModelRegistry.ts — single
        # source of truth). The YAML contains zero hardcoded HF URLs; drift
        # between the registry and the download step is structurally impossible.
        run: |
          set -e
          MODEL="${{ inputs.model || 'qwen3.5-2b' }}"
          MANIFEST=$(node scripts/benchPreflight.mjs --env "$MODEL")
          echo "$MANIFEST" >> "$GITHUB_ENV"
          MODEL_URL=$(echo "$MANIFEST" | grep '^MODEL_URL=' | cut -d= -f2-)
          EXPECTED_BYTES=$(echo "$MANIFEST" | grep '^EXPECTED_BYTES=' | cut -d= -f2-)
          curl -sL -o model.gguf "$MODEL_URL"
          # mmproj is optional — only qwen3.5-4b has one (vision model).
          MMPROJ_URL=$(echo "$MANIFEST" | grep '^MMPROJ_URL=' | cut -d= -f2- || true)
          if [ -n "$MMPROJ_URL" ]; then
            curl -sL -o mmproj.gguf "$MMPROJ_URL"
            ls -la model.gguf mmproj.gguf
          else
            ls -la model.gguf
          fi
          # Fail here on a truncated download — do not wait for the on-device
          # isFileComplete gate (CI run 31420693167: "Modello non ancora scaricato").
          actual=$(stat -c %s model.gguf)
          if [ "$actual" != "$EXPECTED_BYTES" ]; then
            echo "model.gguf size $actual != expected $EXPECTED_BYTES (truncated/corrupt download)"
            exit 1
          fi
          echo "model.gguf OK ($actual bytes)"

      - name: Run bench arm on emulator
        if: matrix.phase == inputs.phase
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35: minSdkVersion 35 (Android 15+ ship policy) — API 34 emulators
          # fail install with INSTALL_FAILED_OLDER_SDK (run 31223190695).
          api-level: 35
          target: google_apis
          arch: x86_64
          # Without a profile the AVD comes up at 320x640 and every tap lands
          # off-screen; a real phone profile also matches the app's layout.
          profile: pixel_6
          # Public repo => 4-vCPU runners; a turn costs ~185s at 4 cores vs 516s at 2.
          cores: 4
          ram-size: 8192M
          # 12 GB userdata: model 5.2 GB (LFM2.5-8B single-copy after mv fix) +
          # system image ~1.5 GB + APK/data 0.5 GB + logs 0.3 GB + FS overhead
          # 0.5 GB + runtime/mmap headroom 2.0 GB = ~10.0 GB peak.  The old
          # 8 GB forced a 10.4 GB peak (cp doubled the 8B) and silently failed.
          # qcow2 is sparse so a larger virtual disk does not slow AVD boot.
          disk-size: 12288M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci-bench.sh
        env:
          PHASE: ${{ matrix.phase }}
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
          BLOCK_FORMAT: ${{ matrix.block_format }}
          THINKING: ${{ matrix.thinking }}
          COMPACTION: ${{ matrix.compaction }}
          # Forcing (required) measured worse than auto on smoke 31640101893 — knob stays so the axis can be re-run; do not re-enable thinking it is untried.
          TOOLCHOICE: ${{ matrix.toolchoice || 'auto' }}
          TOOLGATE: ${{ matrix.toolgate || '1' }}
          NCTX: ${{ inputs.nctx || '' }}
          WINBUDGET: ${{ inputs.winbudget || '' }}
          LEGACYWINDOW: ${{ inputs.legacywindow || '' }}
          RANKING: ${{ inputs.ranking || '' }}
          MEMORY: ${{ inputs.memory || '0' }}
          RUNS_PER_ARM: ${{ inputs.runs_per_arm || '3' }}
          # 40s = SUMMARY_IDLE_DEBOUNCE_MS (8s) + SUMMARIZE_TIMEOUT_MS (30s) +
          # margin. On CI emulator the 2B decodes at ~2.45 tok/s, so
          # SUMMARIZE_N_PREDICT=400 would need ~163s — the summary hits its own
          # 30s timeout on this hardware no matter what. The delay makes that
          # timeout observable (logged) rather than an ambiguous abort at 12s;
          # it does NOT exist to make the summary succeed. fase0 stays at 0.
          # Job timeout-minutes: 300 still covers 16 turns × ~8.6 min work +
          # 15 × 40s idle (~148 min worst case, ~152 min headroom).
          INTER_TURN_DELAY_S: ${{ (matrix.phase == 'fase4' || matrix.phase == 'smoke') && '40' || '0' }}
          MODEL_DIR: ${{ env.MODEL_DIR }}
          MODEL_FILE: ${{ env.MODEL_FILE }}
          MMPROJ_FILE: ${{ env.MMPROJ_FILE }}
          MMPROJ_BYTES: ${{ env.MMPROJ_BYTES }}

      - name: Upload arm result + evidence
        if: always() && matrix.phase == inputs.phase
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ matrix.phase }}-${{ matrix.arm }}-seed${{ matrix.seed || '0' }}
          path: bench-out/**
          if-no-files-found: warn

  aggregate:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download every arm's result.json
        uses: actions/download-artifact@v4
        with:
          pattern: bench-result-*
          path: all-results
          if-no-files-found: warn

      - name: Aggregate + permutation test
        env:
          # Gate only the dispatched phase; fase4 expects 3 modes × 6 seeds.
          BENCH_EXPECT_PHASE: ${{ inputs.phase }}
          BENCH_EXPECT_SEEDS: ${{ inputs.phase == 'fase4' && '6' || '0' }}
        run: |
          # A pipe reports the pipe's exit status, so `node … | tee …` would
          # swallow a non-zero from the completeness gate and mark the job
          # green. Write the markdown first, tee it, then re-exit with the
          # real node status.
          set +e
          node scripts/benchAggregate.mjs all-results > /tmp/aggregate.md
          status=$?
          set -e
          tee "$GITHUB_STEP_SUMMARY" < /tmp/aggregate.md
          exit $status

      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-aggregate-${{ inputs.phase }}
          path: bench-out/AGGREGATE.md
          if-no-files-found: warn
