name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: cargo run -p kalsa-site

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
