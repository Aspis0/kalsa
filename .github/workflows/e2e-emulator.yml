name: E2E emulator (real inference)

# Runs the app on a KVM-accelerated emulator and proves a real on-device
# inference turn: sideloads a GGUF, sends a message, captures the reply.
on:
  push:
    branches: [main, v4.2-context-compaction, feat/moe-stream]
    # A ~35 min emulator run is pointless for docs-only commits.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - docs/**
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test"
        required: true
        default: "qwen3.5-4b"
        type: choice
        options: [qwen3.5-4b, lfm2.5-2.6b]
      compaction:
        description: "Context compaction (PIANO V4.2)"
        required: true
        default: "on"
        type: choice
        options: ["on", "off"]
      thinking:
        description: "Thinking mode"
        required: true
        default: "default"
        type: choice
        options: ["default", budget256, budget512]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm ci

      # A git dependency has no lockfile integrity anyone verifies, and what
      # npm installs is the fork's `npm pack` output, not its commit tree. This
      # refetches the pinned commit, packs it, and compares file by file.
      - name: Assert the installed engine is the pinned fork commit
        run: bash scripts/assert-engine-provenance.sh

      # The fork's cpp/ is kalsallama flattened through an allow-list (the
      # fork's own scripts/sync-kalsallama.sh), so an upstream file a source
      # starts including can be simply absent and the NDK fails ~5 min into
      # the build. This catches it right after install, in seconds.
      - name: Assert the assembled engine's includes all resolve
        # The runner has an NDK, so the syntax pass must use it: the host clang
        # accepts constructs the NDK rejects, and a silent fallback would be a
        # green gate for a weaker check.
        env:
          KALSA_GATE_REQUIRE_NDK: "1"
        run: bash scripts/assert-overlay-includes.sh

      - name: Typecheck + logic harnesses
        run: |
          npm run typecheck
          # The full jest suite on the push that actually protects main:
          # ci.yml (jest) is restricted to feat/**, so a test failing on
          # main used to sit there until someone ran the suite by hand —
          # sessionPersistence.test.ts rotted exactly that way from 7b5b79b.
          # Parallel, in-band of the emulator job's budget: 82 suites /
          # ~950 tests in 14.2 s wall on a 6-core host, well under a minute
          # on the 4-vCPU runner.
          npx jest
          node scripts/retrieverHarness.mjs
          node scripts/compactorHarness.mjs
          node scripts/retrievalLoopHarness.mjs
          node scripts/htmlToTextHarness.mjs
          node scripts/pdfTextHarness.mjs
          node scripts/pdfBridgeHarness.mjs
          node scripts/pdfTextServiceHarness.mjs
          node scripts/webFetchHarness.mjs
          node scripts/toolSourceLedgerHarness.mjs
          node scripts/base64Harness.mjs
          node scripts/pdfCacheFsHarness.mjs
          node scripts/longChatEstimateHarness.mjs
          node scripts/thinkStripperHarness.mjs
          node scripts/streamCoalescerHarness.mjs
          node scripts/turnTelemetryHarness.mjs
          node scripts/thinkingBudgetsHarness.mjs
          node scripts/benchSpeculativeHarness.mjs
          node scripts/bufferShimHarness.mjs
          node scripts/benchEngineHarness.mjs
          node scripts/engineParamsHarness.mjs
          node scripts/threadProfileHarness.mjs
          node scripts/memoryEstimateHarness.mjs
          node scripts/sessionMetaHarness.mjs
          node scripts/sessionSaveGateHarness.mjs
          node scripts/prefixPrewarmHarness.mjs
          node scripts/memoryFactsTailHarness.mjs
          node scripts/voiceStateHarness.mjs
          # ~140s from a cold build. It belongs here and not only in bench.yml,
          # which is workflow_dispatch-only: a mutation matrix that runs on no
          # push is the same decoration as no matrix at all.
          node scripts/webFetchPdfMutationMatrix.mjs
          # Orphan harnesses: until 2026-09-17 these ran in no workflow — which
          # is how embeddingServiceHarness and telemetryHarness rotted silently
          # (both repaired in c1951a8).
          node scripts/anti_oom_harness.mjs
          node scripts/compactionParseHarness.mjs
          node scripts/conversationsStoreHarness.mjs
          node scripts/dailyUseHarness.mjs
          node scripts/deviceProfileHarness.mjs
          node scripts/documentLibraryHarness.mjs
          node scripts/docxToTextHarness.mjs
          node scripts/eagerKickHarness.mjs
          node scripts/embeddingServiceHarness.mjs
          node scripts/i18nParityHarness.mjs
          node scripts/llamaContextGateHarness.mjs
          node scripts/markdownHarness.mjs
          node scripts/regen_harness.mjs
          node scripts/researchPlanHarness.mjs
          node scripts/semanticIndexHarness.mjs
          node scripts/telemetryHarness.mjs
          node scripts/telemetryWorkerHarness.mjs
          node scripts/thinkHistoryHarness.mjs
          node scripts/tuningLayerHarness.mjs

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Prebuild (CNG)
        # The fork ships no prebuilt jniLibs and plugins/withLlamaFromSource.js
        # always compiles cpp/ from source; the env is explicitness only, and
        # KALSA_LLAMA_FROM_SOURCE=0 hard-fails the build.
        env:
          KALSA_LLAMA_FROM_SOURCE: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (x86_64 only — emulator ABI, keeps CI fast)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
          ls -la app/build/outputs/apk/release/

      - name: Assert the native patch is in the binary
        run: bash scripts/assert-native-patch.sh

      - name: Download GGUF model
        run: |
          set -e
          MODEL="${{ inputs.model || 'qwen3.5-4b' }}"
          MANIFEST=$(node scripts/benchPreflight.mjs --env "$MODEL")
          echo "$MANIFEST" >> "$GITHUB_ENV"
          MODEL_URL=$(echo "$MANIFEST" | grep '^MODEL_URL=' | cut -d= -f2-)
          EXPECTED_BYTES=$(echo "$MANIFEST" | grep '^EXPECTED_BYTES=' | cut -d= -f2-)
          curl -sL -o model.gguf "$MODEL_URL"
          actual=$(stat -c %s model.gguf)
          if [ "$actual" != "$EXPECTED_BYTES" ]; then
            echo "model.gguf size $actual != expected $EXPECTED_BYTES (truncated/corrupt download)"
            exit 1
          fi
          echo "model.gguf OK ($actual bytes)"
          MMPROJ_URL=$(echo "$MANIFEST" | grep '^MMPROJ_URL=' | cut -d= -f2- || true)
          if [ -n "$MMPROJ_URL" ]; then
            curl -sL -o mmproj.gguf "$MMPROJ_URL"
            ls -la model.gguf mmproj.gguf
          else
            ls -la model.gguf
          fi

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35: the newest image these jobs are proven on. NOT a floor —
          # minSdkVersion is 33 since 2026-08-22 (app.config.js), so an API 33
          # device is supported and is NOT covered here.
          api-level: 35
          target: google_apis
          arch: x86_64
          # Without a profile the AVD comes up at 320x640 and every tap lands
          # off-screen; a real phone profile also matches the app's layout.
          profile: pixel_6
          # Public repo => 4-vCPU / 16 GB runners. Give the AVD all 4 cores and
          # more RAM: llama.cpp scales with threads, and one turn cost ~8.6 min
          # on the old 2-vCPU runner.
          cores: 4
          ram-size: 8192M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci-e2e.sh
        env:
          COMPACTION: ${{ inputs.compaction || 'on' }}
          THINKING: ${{ inputs.thinking || 'default' }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ inputs.model || 'qwen3.5-4b' }}-compaction-${{ inputs.compaction || 'on' }}
          path: |
            e2e-out/**
          if-no-files-found: warn
