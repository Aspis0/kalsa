[workspace]
resolver = "2"
members = [
    "crates/kalsa-catalog",
    "crates/kalsa-door",
    "crates/kalsa-download",
    "crates/kalsa-files",
    "crates/kalsa-iroh",
    "crates/kalsa-launch",
    "crates/kalsa-pairing",
    "crates/kalsa-probe",
    "crates/kalsa-reuse",
    "crates/kalsa-runtime",
    "crates/kalsa-sentinel",
    "crates/kalsa-supervisor",
    "crates/kalsa-tune",
    "crates/kalsa-web",
    "src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

# The probe's inner loops *are* the measurement, so they are built with
# optimisations in every profile. Unoptimised the same M1 Max reads 5.8 GB/s
# where it really reads 110, and the probe's threads collect 2.4 cores where
# they collect 7.0 — the reading describes the compiler, not the computer, and
# the reliability checks then refuse it and blame the machine for being busy.
# Measured 2026-09-18: `cargo run -p kalsa-probe` debug vs release.
[profile.dev.package.kalsa-probe]
opt-level = 3

# The same lesson, found the same day on the other end of the walk. Verifying
# a 22.13 GB model against its sha256 took ELEVEN MINUTES in a debug build and
# had not finished; the system's own `shasum` did the same file in 74 seconds
# while competing for the disk. Nine times slower, on the one step between a
# finished download and a running assistant, with nothing on screen saying so
# — the app reads as hung. `sha2` is the hot loop, `kalsa-download` drives it.
# Measured 2026-09-18 on the first end-to-end product run.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.kalsa-download]
opt-level = 3
