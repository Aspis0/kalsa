# Engines that pass every catalog gate (27 rows).
# Numbers are as published by the authors; none were re-run by Kalsa.

[tooling.uv]
kind = "release-archive"
url = "https://github.com/astral-sh/uv/releases/download/0.13.9/uv-aarch64-apple-darwin.tar.gz"
tag = "0.13.9"
sha256 = "5aeca67f2283f75235de40d0bd9c0a5bbc5fce23b6d48b3bf9fa1b2db08382ca"
size = 14554974
binary = "uv-aarch64-apple-darwin/uv"

[[engine]]
id = "llama-cpp"
name = "llama.cpp"
repo = "ggml-org/llama.cpp"
author = "ggml-org (org)"
license = "MIT"
kind = "reference"
hardware = ["apple-m1", "apple-m2", "apple-m3", "apple-m4", "apple-m5", "nvidia", "amd", "intel", "cpu"]
summary = "Reference upstream across Metal, CUDA, ROCm/HIP, Vulkan, SYCL and CPU"

[engine.install]
kind = "release-archive"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b12521/llama-b12521-bin-macos-arm64.tar.gz"
tag = "b12521"
sha256 = "6ebeeea8575081ff968eb1c26f6fffcafe8e3ff2a0fb5d548c0aea7f5575e038"
size = 17294048
binary = "llama-b12521/llama-server"

# Small models Kalsa suggests for this engine. Each exists on Hugging Face (checked 2026-11-18 through
# the public API: not gated, not private). The quant tag pins the one file llama-server downloads, so
# the size is that file's size and nothing is guessed.
[[engine.suggested_models]]
id = "ggml-org/gemma-3-1b-it-GGUF:Q4_K_M"
note = "Gemma 3, 1 billion parameters, 4-bit"
size_bytes = 806058240

[[engine.suggested_models]]
id = "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
note = "Qwen 2.5, 1.5 billion parameters, 4-bit"
size_bytes = 1117320736

[[engine.suggested_models]]
id = "bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M"
note = "Llama 3.2, 1 billion parameters, 4-bit"
size_bytes = 807694464

[[engine]]
id = "mlx-lm"
name = "mlx-lm"
repo = "ml-explore/mlx-lm"
author = "ml-explore (Apple)"
license = "MIT"
kind = "reference"
hardware = ["apple-m1", "apple-m2", "apple-m3", "apple-m4", "apple-m5"]
summary = "Reference upstream for Apple Silicon (MLX)"

# uv 0.13.9 verifies managed Python downloads against the sha256 carried in
# its pinned download metadata: uv-python/src/downloads.rs checks the hash
# before installing (astral-sh/uv, commit 262a50bb, lines 1474-1490).
[engine.install]
kind = "pip"
package = "mlx-lm"
version = "0.32.2"
python = "3.12.13"
lock = "catalog/locks/mlx-lm.txt"

# The size is the repository's model.safetensors (the weights, without the small tokenizer files).
[[engine.suggested_models]]
id = "mlx-community/Llama-3.2-1B-Instruct-4bit"
note = "Llama 3.2, 1 billion parameters, 4-bit"
size_bytes = 695283921

[[engine.suggested_models]]
id = "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
note = "Qwen 2.5, 1.5 billion parameters, 4-bit"
size_bytes = 868628559

[[engine.suggested_models]]
id = "mlx-community/gemma-3-1b-it-4bit"
note = "Gemma 3, 1 billion parameters, 4-bit"
size_bytes = 732577304

