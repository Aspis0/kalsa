author = "antirez"
license = "MIT"
kind = "engine"
website = "https://dwarfstar.sh"
website_label = "Community site"
hardware = ["apple-m1", "apple-m2", "apple-m3", "apple-m4", "apple-m5", "apple-m6", "nvidia", "amd"]
summary = "Inference engine in C built around a few large models (DeepSeek V4 Flash and PRO, GLM 5.x, Qwen3.8), with Metal, CUDA and ROCm backends"

[[engine.improvement]]
kind = "bigger-models"
summary = "DeepSeek Flash at 2-bit, about 81 GiB, decodes at 34.36 tok/s with a 32,768-token context on a 128 GB Mac"
machine = "M5 Max, 128 GB"
chip_tag = "apple-m5"
model = "DeepSeek Flash Q2"
source = "https://github.com/antirez/ds4/blob/main/docs/PERFORMANCE.md"
model_gib = 81.0
memory_gb = 128.0
tok_s = 34.36

[[engine.improvement]]
kind = "bigger-models"
summary = "GLM 5.3 Flash at Q4_K, 177.77 GiB and larger than the 128 GB of memory, runs from the SSD at 11.9–14.9 tok/s (three-run median, 2K prompt plus 1K append, 128 generated tokens)"
machine = "M5 Max, 128 GB"
chip_tag = "apple-m5"
model = "GLM 5.3 Flash Q4_K"
source = "https://github.com/antirez/ds4/blob/main/docs/SSD_STREAMING.md"
tradeoff = "The expert weights are read from the SSD, so it needs a fast local SSD, and the speed depends on the prompt."
model_gib = 177.77
memory_gb = 128.0
tok_s = 11.9

[[engine.improvement]]
kind = "multi-machine"
summary = "Two 128 GB Macs linked over RDMA run DeepSeek V4 Flash Q4 or MXFP4, or GLM 5.3 Flash Q4, with tensor parallelism that splits the experts between them"
machine = "Two 128 GB Macs over RDMA"
source = "https://github.com/antirez/ds4/blob/main/docs/DISTRIBUTED.md"
tradeoff = "The link between the machines has no authentication or encryption, so it needs a trusted network."

[[engine.improvement]]
kind = "new-hardware"
summary = "DeepSeek V4 Flash runs on eight NVIDIA L40S cards (Ada Lovelace) at about 126 tok/s aggregate with 16 sessions; the author says other implementations of these models need newer GPUs"
machine = "8x NVIDIA L40S"
chip_tag = "nvidia"
model = "DeepSeek V4 Flash"
source = "https://github.com/antirez/ds4/blob/main/docs/CUDA_MULTI_GPU.md"
tradeoff = "The 126 tok/s is total throughput across sessions, not the speed of one user."

