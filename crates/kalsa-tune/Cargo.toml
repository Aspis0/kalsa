[package]
name = "kalsa-tune"
description = "Which launch settings run fastest on this machine with this model: measured, never assumed"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure decision and one file: the candidates it compares, the trial it
# picks, the record it keeps. The candidate servers are run by the caller —
# this crate neither starts processes nor opens sockets, which is what makes
# the decision testable without hardware.
[dependencies]
kalsa-launch = { path = "../kalsa-launch" }
kalsa-runtime = { path = "../kalsa-runtime" }
