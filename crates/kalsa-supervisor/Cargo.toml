[package]
name = "kalsa-supervisor"
description = "Process supervision for the Kalsa Brain inference server"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately UI-free and dependency-light: the app shell may come and go, this
# must stay testable with `cargo test -p kalsa-supervisor`.
[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
