[package]
name = "kalsa-door"
description = "Authenticated loopback door for the Kalsa Brain OpenAI endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The bearer credential is fixed-size and compared without a timing branch.
subtle = "2"
# 128 random bits per job id: a resume id nobody can guess its way into.
getrandom = "0.3"
# The per-device cache salt: a labeled SHA-256 of the credential, derived
# once when the entry is built and never stored or printed anywhere.
sha2 = "0.10"

[dev-dependencies]
# The test mints the same public handshake credential the desktop stores.
kalsa-catalog = { path = "../kalsa-catalog" }
kalsa-pairing = { path = "../kalsa-pairing" }
serde_json = "1"
