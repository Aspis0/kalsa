[package]
name = "kalsa-probe"
description = "Memory bandwidth and compute probe: predict a model before downloading it"
version.workspace = true
edition.workspace = true
license.workspace = true

# No measurement dependency at all: the probes are plain loops over plain
# buffers, so the numbers are the machine's, not a library's. Serde is the
# one exception: the app writes the measurement down as a record, and the
# types carry the derives so no second, drifting shape of them ever exists.
[dependencies]
serde = { version = "1", features = ["derive"] }

# Only for the CPU-time diagnostic behind the reliability verdict.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same diagnostic on Windows: `GetProcessTimes` (this process's kernel and
# user time) behind `cpu_seconds`, so the parallelism check runs there too.
# `Win32_System_Registry` is the display class's own VRAM figure
# (`HardwareInformation.qwMemorySize`, `vram_registry.rs`): WMI's 32-bit
# AdapterRAM saturates below any card over 4 GiB.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[[bin]]
name = "kalsa-probe"
path = "src/bin/kalsa-probe.rs"
