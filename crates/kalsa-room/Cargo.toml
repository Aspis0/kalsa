[package]
name = "kalsa-room"
description = "The room's store: one persisted transcript, member display names, and a subscribe primitive"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The transcript's lines and the names file are plain, versioned JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The names file rides the pairing store's owner-only atomic publication
# (temp beside the target, restricted, flushed, renamed) rather than growing
# a second one whose permissions could drift apart from the credential's.
kalsa-pairing = { path = "../kalsa-pairing" }
