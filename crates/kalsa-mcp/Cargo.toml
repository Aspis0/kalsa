[package]
name = "kalsa-mcp"
description = "Kalsa's generic MCP host: server registry, namespaced tools, allow/ask/deny permissions and tool pins"
version.workspace = true
edition.workspace = true
license.workspace = true

# rmcp is pinned exactly: it moved five times in ten weeks, and the host's
# checks depend on how it frames requests. The child is spawned here, not by
# rmcp's child transport, because a first-party bootstrap secret is the first
# stdin line and that transport keeps stdin to itself.
[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
zeroize = "1.9"

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-async-rw"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "test-util"] }

# The fixture is a stdio server. Under the libtest harness it would print its
# own test banner onto the protocol stream. It is built by cargo test but not
# run as a test: it needs a bootstrap line on stdin.
[[example]]
name = "mcp_test_server"
harness = false
test = false
